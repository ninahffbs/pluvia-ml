; Firmware da ESP32-CAM (AI-Thinker) do Pluvia.
; Compilar: pio run          Gravar: pio run -t upload          Monitor serial: pio device monitor
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
